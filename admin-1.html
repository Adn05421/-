<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة تحكم المسابقة</title>
<style>
:root{--bg:#F2F6F4;--card:#FFFFFF;--ink:#12302D;--mute:#5B726E;--em:#14675A;--em-ink:#FFFFFF;--line:#D5E1DD;--no:#A3342F;--hd:#0F3B36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0C1A19;--card:#142624;--ink:#E6F0ED;--mute:#93ADA8;--em:#3FB59F;--em-ink:#06201C;--line:#254240;--no:#F08A84;--hd:#0A2623;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",system-ui,sans-serif;line-height:1.6}
header{background:var(--hd);color:#fff;padding:18px}
h1{margin:0;font-size:1.3rem;max-width:640px;margin-inline:auto}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:1.05rem;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);font-size:.92rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:start}
td.low{color:var(--no);font-weight:700}
.btn{display:inline-block;background:var(--em);color:var(--em-ink);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;margin:0 0 8px}
.btn.alt{background:transparent;color:var(--em);border:1.5px solid var(--em)}
.btn.del{background:transparent;color:var(--no);border:1.5px solid var(--no);padding:6px 10px}
.btn.sm{padding:6px 10px}
label{display:block;font-size:.9rem;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.item p{margin:0;flex:1}
.item small{color:var(--mute)}
.note{color:var(--mute);font-size:.88rem}
#msg{color:var(--no);font-weight:700;min-height:1.4em}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--em);outline-offset:2px}
</style>
</head>
<body>
<header><h1>لوحة تحكم المسابقة</h1></header>
<main>
<div class="card">
<button class="btn" id="exp">تصدير questions.json</button>
<button class="btn alt" id="reload">استرجاع النسخة المنشورة</button>
<label>استيراد ملف أسئلة <input type="file" id="imp" accept=".json,application/json"></label>
<label>مدة الإجابة بالثواني <input type="number" id="sec" min="3" max="120" value="15"></label>
<p class="note">بعد التعديل اضغط «تصدير»، ثم ارفع الملف إلى GitHub مكان القديم لتظهر الأسئلة للجميع. تُحفظ تعديلاتك مسودةً على هذا الجهاز تلقائيًا.</p>
</div>
<h2>عدد الأسئلة (الأحمر أقل من 4 ولا يكفي جولة كاملة)</h2>
<div id="stats"></div>
<h2>الأسئلة</h2>
<button class="btn" id="new">+ سؤال جديد</button>
<select id="flt"></select>
<div id="f" class="card" hidden></div>
<div id="list"></div>
<p id="msg"></p>
</main>
<script>
var CATS={quran:'القرآن الكريم',seerah:'السيرة النبوية',prophets:'قصص الأنبياء',fiqh:'الفقه والعبادات'};
var LVS={1:'سهل',2:'متوسط',3:'صعب'};
var FIELDS=[['q','السؤال'],['a','الإجابة الصحيحة'],['w1','خيار خاطئ ١'],['w2','خيار خاطئ ٢'],['w3','خيار خاطئ ٣'],['x','الشرح والمصدر']];
var data={sec:15,questions:[]},editing=null;
function $(id){return document.getElementById(id)}
function msg(t){$('msg').textContent=t||''}
function save(){try{localStorage.setItem('draft',JSON.stringify(data))}catch(e){}}
function load(j,keep){if(Array.isArray(j))j={questions:j};data.sec=+j.sec||15;data.questions=j.questions||[];$('sec').value=data.sec;if(!keep)save();draw()}
function fetchPub(){return fetch('questions.json?v='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){load(j)})}
function nextId(){return data.questions.reduce(function(m,q){return Math.max(m,q.id)},-1)+1}
function draw(){
var h='<table><tr><th></th>'+[1,2,3].map(function(l){return'<th>'+LVS[l]+'</th>'}).join('')+'</tr>';
Object.keys(CATS).forEach(function(c){h+='<tr><td>'+CATS[c]+'</td>'+[1,2,3].map(function(l){var n=data.questions.filter(function(q){return q.c==c&&q.d==l}).length;return'<td'+(n<4?' class="low"':'')+'>'+n+'</td>'}).join('')+'</tr>'});
$('stats').innerHTML=h+'</table><p class="note">المجموع: '+data.questions.length+' سؤالًا</p>';
var f=$('flt'),cur=f.value;
f.innerHTML='<option value="">كل الأقسام</option>'+Object.keys(CATS).map(function(c){return'<option value="'+c+'">'+CATS[c]+'</option>'}).join('');f.value=cur;
var L=$('list');L.innerHTML='';
data.questions.filter(function(q){return!f.value||q.c==f.value}).forEach(function(q){
var d=document.createElement('div');d.className='item';
var p=document.createElement('p');p.textContent=q.q[0];
var s=document.createElement('small');s.textContent=' ('+CATS[q.c]+' · '+LVS[q.d]+')';p.appendChild(s);
var e=document.createElement('button');e.className='btn alt sm';e.textContent='تعديل';e.dataset.e=q.id;
var x=document.createElement('button');x.className='btn del';x.textContent='حذف';x.dataset.x=q.id;
d.appendChild(p);d.appendChild(e);d.appendChild(x);L.appendChild(d)})}
function form(q){
editing=q?q.id:null;
var h='<label>القسم</label><select id="fc">'+Object.keys(CATS).map(function(c){return'<option value="'+c+'">'+CATS[c]+'</option>'}).join('')+'</select><label>المرحلة</label><select id="fd">'+[1,2,3].map(function(l){return'<option value="'+l+'">'+LVS[l]+'</option>'}).join('')+'</select>';
FIELDS.forEach(function(k){h+='<label>'+k[1]+' (عربي / English)</label><div class="pair"><input id="'+k[0]+'_0" dir="rtl"><input id="'+k[0]+'_1" dir="ltr"></div>'});
h+='<p><button class="btn" id="sv">حفظ السؤال</button> <button class="btn alt" id="cn">إلغاء</button></p>';
$('f').innerHTML=h;$('f').hidden=false;
if(q){$('fc').value=q.c;$('fd').value=q.d;set('q',q.q);set('a',q.o[0]);set('w1',q.o[1]);set('w2',q.o[2]);set('w3',q.o[3]);set('x',q.x)}
$('f').scrollIntoView()}
function set(k,v){$(k+'_0').value=v[0];$(k+'_1').value=v[1]}
function val(k,l){return $(k+'_'+l).value.trim()}
function saveQ(){
var miss=FIELDS.some(function(k){return!val(k[0],0)||!val(k[0],1)});
if(miss){msg('أكمل كل الخانات بالعربية والإنجليزية');return}
var it={id:editing!=null?editing:nextId(),c:$('fc').value,d:+$('fd').value,q:[val('q',0),val('q',1)],o:[[val('a',0),val('a',1)],[val('w1',0),val('w1',1)],[val('w2',0),val('w2',1)],[val('w3',0),val('w3',1)]],x:[val('x',0),val('x',1)]};
var i=data.questions.findIndex(function(q){return q.id==it.id});
if(i>=0)data.questions[i]=it;else data.questions.push(it);
$('f').hidden=true;msg('');save();draw()}
function exp(){
data.sec=+$('sec').value||15;save();
var b=new Blob([JSON.stringify({sec:data.sec,questions:data.questions},null,1)],{type:'application/json'});
var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='questions.json';document.body.appendChild(a);a.click();a.remove()}
$('exp').onclick=exp;
$('new').onclick=function(){form(null)};
$('flt').onchange=draw;
$('reload').onclick=function(){if(confirm('سيستبدل هذا مسودتك بالنسخة المنشورة. متابعة؟'))fetchPub().catch(function(){msg('تعذر تحميل الملف المنشور')})};
$('imp').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{load(JSON.parse(r.result));msg('')}catch(x){msg('الملف غير صالح')}};r.readAsText(f)};
$('f').onclick=function(e){if(e.target.id=='sv')saveQ();if(e.target.id=='cn'){$('f').hidden=true;msg('')}};
$('list').onclick=function(e){var b=e.target;
if(b.dataset.e!==undefined){form(data.questions.find(function(q){return q.id==b.dataset.e}))}
if(b.dataset.x!==undefined&&confirm('حذف هذا السؤال؟')){data.questions=data.questions.filter(function(q){return q.id!=b.dataset.x});save();draw()}};
var draft=null;try{draft=JSON.parse(localStorage.getItem('draft')||'null')}catch(e){}
if(draft&&draft.questions&&draft.questions.length){load(draft,true)}else{draw();fetchPub().catch(function(){msg('تعذر تحميل الملف المنشور، استورد ملف الأسئلة يدويًا')})}
</script>
</body>
</html>
